<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent HQ</title>
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="static/hub/hub.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#/home" aria-label="Agent HQ home">
      <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9ccff"/><stop offset="1" stop-color="#7a5cff"/></linearGradient></defs><path d="M16 3 29 27H21l-5-9-5 9H3z" fill="url(#bm)"/><path d="M16 12l3.2 6h-6.4z" fill="#0b0910"/></svg></span>
      <span><span class="brand-name">Agent HQ</span><span class="brand-sub">your studio</span></span>
    </a>
    <button class="search" data-act="cmdk" type="button"><span class="i" data-i="search"></span><span class="search-l">Search or jump to…</span><kbd>Ctrl K</kbd></button>
    <nav id="nav" aria-label="Pages"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="icon-btn menu-btn" data-act="menu" type="button" aria-label="Menu"><span class="i" data-i="plan"></span></button>
      <div class="crumbs">
        <button class="game-pick" id="gamePick" type="button" aria-haspopup="menu"><span class="gp-ic" id="gpIc"></span><span id="gameName">All games</span><span class="i sm" data-i="chev"></span></button>
        <span class="slash" aria-hidden="true">/</span>
        <span class="crumb-page" id="crumbPage">Home</span>
      </div>
      <div class="top-r">
        <span class="status-pill" id="statusPill"><i class="dot"></i><span>Connecting…</span></span>
        <button class="btn sm" id="refresh" type="button"><span class="i" data-i="refresh"></span><span class="hide-sm">Refresh</span></button>
        <a class="btn sm primary" href="#/review" id="inboxBtn"><span class="i" data-i="bell"></span>Inbox<span class="count" id="inboxN" hidden></span></a>
      </div>
    </header>
    <div class="view" id="view" tabindex="-1"></div>
  </main>
</div>

<div class="menu" id="menu" hidden role="menu"></div>
<div class="layer" id="drawer" hidden><div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside></div>
<div class="layer" id="modal" hidden><div class="scrim" data-act="close"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<div class="cmdk" id="cmdk" hidden>
  <div class="cmdk-box" role="dialog" aria-modal="true" aria-label="Search">
    <div class="cmdk-in"><span class="i" data-i="search"></span><input id="cmdkInput" placeholder="Jump to a page, agent, task or game…" autocomplete="off"><kbd>Esc</kbd></div>
    <div class="cmdk-list" id="cmdkList"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="static/hub/hub.js"></script>
</body>
</html>
